apiVersion: v1
kind: Secret
metadata:
  name: pingboard-db
  labels:
    app: db
type: Opaque
stringData:
  password: {{ .Values.db.password | quote }}
  database-url: "postgresql://{{ .Values.db.user }}:{{ .Values.db.password | urlquery }}@db:5432/{{ .Values.db.name }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pingboard-db-init
  labels:
    app: db
data:
  init.sql: |
    {{- .Files.Get "files/init.sql" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingboard-db
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: pingboard-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
