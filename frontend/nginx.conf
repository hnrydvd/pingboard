server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Same-origin proxy to the API, so the browser never needs CORS.
    # In k8s this becomes an Ingress / HTTPRoute rule instead.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
